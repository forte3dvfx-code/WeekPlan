<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEAE6">
<meta name="description" content="A rotina da semana: blocos, tarefas e progresso, guardados só neste dispositivo.">
<title>Cadência</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<script>
  // Tema antes de desenhar, para não piscar em claro no modo escuro
  (function () {
    var e = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = e ? 'dark' : 'light';
  })();
</script>
</head>
<body>

<div id="app"></div>

<nav class="tabs" aria-label="Navegação">
  <button type="button" class="tab on" data-v="hoje">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>
    <span>Hoje</span>
  </button>
  <button type="button" class="tab" data-v="semana">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 10h17M9.5 10v10.5M14.5 10v10.5"/></svg>
    <span>Semana</span>
  </button>
  <button type="button" class="tab" data-v="evolucao">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 20v-6M12 20V8M17 20v-9"/></svg>
    <span>Evolução</span>
  </button>
  <button type="button" class="tab" data-v="ajustes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    <span>Ajustes</span>
  </button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/db.js"></script>
<script src="js/drive.js"></script>
<script src="js/app.js"></script>
</body>
</html>
